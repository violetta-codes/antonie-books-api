[pytest]
# Pytest configuration
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    crud: CRUD operation tests
    authors: Author management tests
    publishers: Publisher aggregation tests
    health: Health check tests
