version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: books_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - books_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: books_api
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/books_db
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - books_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mongodb_data:

networks:
  books_network:
    driver: bridge

